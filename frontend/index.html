<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>QualiSync</title>
    <link rel="stylesheet" href="https://unpkg.com/wangeditor@4.7.15/dist/css/style.css" />
    <style>
      html {
        height: 100%;
      }
      body {
        height: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
        background: #fafbfc;
        color: #111827;
      }
      body.theme-dark {
        background: #111827;
        color: #d1d5db;
      }
    </style>
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('uiTheme') || 'light';
        } catch (e) {}
        document.documentElement.className = theme === 'dark' ? 'theme-dark' : 'theme-light';
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.remove('theme-dark', 'theme-light');
          document.body.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
        });
      })();
    </script>
  </head>
  <body class="theme-light">
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
